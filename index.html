<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Vexis // Ultra Protector 5X</title>
<style>
:root{ --bg:#080a10;--panel:#111521;--panel2:#0b0f18;--green:#00f5a0;--text:#d7e0ee;--muted:#778399;--border:#242e42; --purple:#9b70ff; --red:#ff637d; --yellow:#ffd166; }
*{box-sizing:border-box;margin:0;padding:0;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
body{min-height:100vh;padding:22px;color:var(--text);background:var(--bg)}
.container{max-width:960px;margin:0 auto;padding:25px;background:linear-gradient(145deg,#141a29,#0e121c);border:1px solid var(--border);border-radius:16px;}
header{display:flex;justify-content:space-between;margin-bottom:24px;color:var(--green)}
select{width:100%;padding:11px 12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;outline:none;margin-bottom:15px;}
textarea{display:block;width:100%;min-height:150px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:#b6f7db;margin-bottom:10px;font-size:0.85rem;}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px;}
button{border:none;border-radius:9px;font-weight:800;cursor:pointer;padding:11px 14px;font-size:0.8rem;color:#04120c;}
.btn-obf{background:var(--green);}
.btn-deobf{background:var(--purple); color: #fff;}
.btn-val{background:var(--yellow);}
.btn-copy{background:var(--panel2); color: var(--text); border: 1px solid var(--border);}
.btn-down{background:#10372e; color:#80ffd0; border: 1px solid #1d765b;}
.btn-clear{background:var(--red); color: #fff;}
.status{padding:11px;background:#080c13;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:0.8rem;}
</style>
</head>
<body>
<main class="container">
 <header><h1>VEXIS // ULTRA 5X</h1></header>
 
 <label>NIVEL DE OFUSCACIÓN</label>
 <select id="level">
   <option value="ultra5" selected>Ultra 5X (Quintuple XOR)</option>
 </select>

 <label>01 / CÓDIGO O TEXTO</label>
 <textarea id="input" placeholder="Pega aquí tu script Lua o el código protegido..."></textarea>
 
 <div class="actions">
   <button class="btn-obf" id="obfuscate">◆ OFUSCAR</button>
   <button class="btn-deobf" id="deobfuscate">◇ DESOFUSCAR</button>
   <button class="btn-val" id="validate">✓ VALIDAR</button>
   <button class="btn-copy" id="copy">▣ COPIAR</button>
   <button class="btn-down" id="download">↓ DESCARGAR</button>
   <button class="btn-clear" id="clear">× LIMPIAR</button>
 </div>

 <label>02 / RESULTADO</label>
 <textarea id="output" readonly placeholder="El resultado aparecerá aquí..."></textarea>
 <div class="status" id="status">Esperando...</div>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output');

// Base64
function b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64d(str) { return decodeURIComponent(escape(atob(str))); }

// XOR Dinámico
function xorString(text, key) {
    let result = "";
    for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return result;
}

// Formatear para Lua
function luaLongString(payload){
 let eq=''; while(payload.includes(']'+eq+']')) eq+='=';
 return '['+eq+'['+payload+']'+eq+']';
}

// ============ LÓGICA DE OFUSCAR ============
function obfuscate(){
 const source = input.value;
 if(!source.trim()) return $('status').textContent = '⚠️ Pega un contenido primero.';
 
 if (source.includes("VEXIS ULTRA 5X PROTECTOR")) {
     return $('status').textContent = '❌ Este código ya está protegido.';
 }

 try {
   let result = "";
   
   const now = new Date();
   const key1 = "A" + now.getTime(); 
   const key2 = "B" + (now.getTime() + 1);
   const key3 = "C" + (now.getTime() + 2);
   const key4 = "D" + (now.getTime() + 3);
   const key5 = "E" + (now.getTime() + 4);

   let b64_1 = b64e(source);
   let enc_1 = xorString(b64_1, key1);
   let enc_2 = xorString(enc_1, key2);
   let enc_3 = xorString(enc_2, key3);
   let enc_4 = xorString(enc_3, key4);
   let enc_5 = xorString(enc_4, key5);
   let finalPayload = b64e(enc_5);

   // Se eliminó el Junk Code
   result = `--[[ VEXIS ULTRA 5X PROTECTOR | ANTI-IA ]]
-- PROTECTED ASSET | DO NOT DISTRIBUTE
local _d = ${luaLongString(finalPayload)}
local _k1 = "${key1}"
local _k2 = "${key2}"
local _k3 = "${key3}"
local _k4 = "${key4}"
local _k5 = "${key5}"

local function _a(b)
    local c, d, e = {}, 0, 0
    b = b:gsub("[^ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=]", "")
    for f = 1, #b do
        local g = b:sub(f, f)
        if g == "=" then break end
        local h = ("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"):find(g, 1, true)
        d = d * 64 + h - 1
        e = e + 6
        if e >= 8 then
            e = e - 8
            c[#c+1] = string.char(math.floor(d / 2^e) % 256)
            d = d % 2^e
        end
    end
    return table.concat(c)
end

local function _b(c, k)
    local d, e = 0, 1
    for f = 1, 8 do
        local g = c % 2
        local h = k % 2
        if g ~= h then d = d + e end
        c = math.floor(c / 2); k = math.floor(k / 2); e = e * 2
    end
    return d
end

local function _unxor(t, k)
    local res = {}
    for i = 1, #t do
        res[i] = string.char(_b(string.byte(t, i), string.byte(k, (i - 1) % #k + 1)))
    end
    return table.concat(res)
end

local _step5 = _a(_d)
local _step4 = _unxor(_step5, _k5)
local _step3 = _unxor(_step4, _k4)
local _step2 = _unxor(_step3, _k3)
local _step1 = _unxor(_step2, _k2)
local _decrypted_b64 = _unxor(_step1, _k1)
local _src = _a(_decrypted_b64)

local _env = getfenv and getfenv() or _G
local _ls = _env.loadstring or loadstring
if _ls then 
    local _c = _ls(_src) 
    if _c then _c() end 
end`;

   output.value = result;
   $('status').textContent = `✅ Protección ULTRA 5X generada.`;
 } catch(e) { $('status').textContent = '❌ Error: ' + e.message; }
}

// ============ LÓGICA DE DESOFUSCAR ============
function deobfuscate() {
    let source = input.value;
    if (!source.trim()) return $('status').textContent = '⚠️ Pega un script protegido primero.';

    if (!source.includes("VEXIS ULTRA 5X PROTECTOR")) {
        return $('status').textContent = '❌ Este script no fue protegido con VEXIS ULTRA 5X.';
    }

    try {
        let match = source.match(/local _d = \[(=*)\[(.*?)\]\1\]/s);
        if (!match) return $('status').textContent = '❌ No se encontró el payload.';
        let payload = match[2];

        let k1_match = source.match(/local _k1 = "(.*?)"/);
        let k2_match = source.match(/local _k2 = "(.*?)"/);
        let k3_match = source.match(/local _k3 = "(.*?)"/);
        let k4_match = source.match(/local _k4 = "(.*?)"/);
        let k5_match = source.match(/local _k5 = "(.*?)"/);
        
        if (!k1_match || !k2_match || !k3_match || !k4_match || !k5_match) return $('status').textContent = '❌ No se encontraron todas las llaves.';

        let dec_5 = b64d(payload); 
        let dec_4 = xorString(dec_5, k5_match[1]); 
        let dec_3 = xorString(dec_4, k4_match[1]); 
        let dec_2 = xorString(dec_3, k3_match[1]); 
        let dec_1 = xorString(dec_2, k2_match[1]); 
        let dec_0 = xorString(dec_1, k1_match[1]); 
        let original = b64d(dec_0); 

        output.value = original;
        $('status').textContent = '✅ Desofuscado correctamente.';
    } catch (e) {
        $('status').textContent = '❌ Error al desofuscar: ' + e.message;
    }
}

// ============ LÓGICA DE VALIDAR (ARREGLADO) ============
function validate() {
    // Ahora valida el resultado (la caja de abajo)
    const text = output.value;
    
    if(!text.trim()) return $('status').textContent = '⚠️ No hay resultado generado para validar.';
    
    if(!text.includes("VEXIS ULTRA 5X PROTECTOR")) {
        return $('status').textContent = '❌ El resultado no tiene la firma de VEXIS.';
    }

    if(text.includes("local _d =") && text.includes("local _k1 =") && text.includes("local _k5 =")) {
        $('status').textContent = '✅ Estructura VEXIS ULTRA válida. El script compilará bien.';
    } else {
        $('status').textContent = '⚠️ Tiene la firma, pero le falta el payload o las llaves.';
    }
}

async function copy(){
 if(!output.value) return;
 await navigator.clipboard.writeText(output.value);
 $('status').textContent = '📋 Copiado al portapapeles.';
}

function download() {
 if(!output.value.trim()) return $('status').textContent = 'No hay resultado para descargar.';
 const blob = new Blob([output.value], {type: 'text/plain;charset=utf-8'});
 const url = URL.createObjectURL(blob), a = document.createElement('a');
 a.href = url; a.download = 'Vexis_Ultra_5X.lua';
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(() => URL.revokeObjectURL(url), 1000);
 $('status').textContent = '📥 Archivo descargado.';
}

function clear(){
 input.value = ''; output.value = '';
 $('status').textContent = 'Campos limpiados.';
}

$('obfuscate').addEventListener('click', obfuscate);
$('deobfuscate').addEventListener('click', deobfuscate);
$('validate').addEventListener('click', validate);
$('copy').addEventListener('click', copy);
$('download').addEventListener('click', download);
$('clear').addEventListener('click', clear);
</script>
</body>
</html>
