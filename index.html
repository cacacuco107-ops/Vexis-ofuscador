<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Universal Script Protector & Deobfuscator</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #12131a;
            --accent-green: #00ff66;
            --accent-blue: #00bbff;
            --accent-red: #ff3333;
            --text-main: #c0c0d0;
            --border-color: #222638;
            --input-bg: #07080a;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --accent-green: #008736;
            --accent-blue: #0066cc;
            --accent-red: #cc0000;
            --text-main: #222222;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; transition: background 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.05);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .counter-badge {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        h1 {
            color: var(--accent-green);
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            outline: none;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--input-bg);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-green);
            color: var(--bg-color);
        }

        button.btn-decode {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        button.btn-decode:hover {
            background: var(--accent-blue);
            color: var(--bg-color);
        }

        button.btn-download {
            color: #a855f7;
            border-color: #a855f7;
        }
        button.btn-download:hover {
            background: #a855f7;
            color: #fff;
        }

        button.secondary {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        button.secondary:hover {
            background: var(--accent-red);
            color: var(--bg-color);
        }

        .output-box {
            margin-top: 25px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            min-width: auto;
        }
        .theme-toggle:hover {
            background: var(--border-color);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="counter-badge">📊 Scripts protegidos: <span id="statsCounter">0</span></div>
            <button class="theme-toggle" onclick="toggleTheme()">🎨 Cambiar Modo</button>
        </div>

        <h1>[§] Vexis Vault // Universal Guard</h1>
        <div class="subtitle">Protección avanzada, niveles de ofuscación y exportación de archivos</div>

        <div class="section">
            <label for="obfuscationLevel">&gt; NIVEL DE OFUSCACIÓN:</label>
            <select id="obfuscationLevel">
                <option value="basic">Básico (Base64 Estándar)</option>
                <option value="medium">Medio (Base64 Invertido)</option>
                <option value="advanced">Avanzado (Desplazamiento de caracteres)</option>
            </select>

            <label for="inputCode">&gt; CÓDIGO DE ENTRADA:</label>
            <textarea id="inputCode" placeholder="Pega aquí tu script o código a proteger..."></textarea>
            
            <div class="btn-group">
                <button onclick="protectScript()">OFUSCAR & PROTEGER</button>
                <button class="btn-decode" onclick="deobfuscateScript()">DESOFUSCAR</button>
                <button class="secondary" onclick="clearFields()">LIMPIAR</button>
            </div>
        </div>

        <div class="section output-box">
            <label for="outputCode">&gt; RESULTADO:</label>
            <textarea id="outputCode" readonly placeholder="El resultado aparecerá aquí..."></textarea>
            <div class="btn-group" style="margin-top: 10px;">
                <button onclick="copyToClipboard()">COPIAR AL PORTAPAPELES</button>
                <button class="btn-download" onclick="downloadFile()">📥 DESCARGAR .TXT</button>
            </div>
        </div>
    </div>

    <script>
        let protectedCount = localStorage.getItem('vexis_count') || 0;
        document.getElementById('statsCounter').innerText = protectedCount;

        function updateCounter() {
            protectedCount++;
            localStorage.setItem('vexis_count', protectedCount);
            document.getElementById('statsCounter').innerText = protectedCount;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function protectScript() {
            const input = document.getElementById('inputCode').value;
            const level = document.getElementById('obfuscationLevel').value;
            if (!input) return;

            try {
                let base64 = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                    return String.fromCharCode('0x' + p1);
                }));

                let payload = base64;

                if (level === 'medium') {
                    payload = base64.split('').reverse().join('');
                } else if (level === 'advanced') {
                    payload = base64.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join('');
                }

                let protectedScript = `--[[
    VEXIS PROTECTED GUARD // NIVEL: ${level.toUpperCase()}
    ✅ Compatible con Delta y ejecutores de Roblox
]]--

local _V = "${payload}"
local _L = "${level}"

local function _D(p, l)
    local d = p
    if l == "medium" then
        d = d:reverse()
    elseif l == "advanced" then
        d = d:gsub('.', function(c) return string.char(c:byte() - 2) end)
    end
    
    local b = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
    return (d:gsub('.', function(x)
        if x == '=' then return '' end
        local idx = b:find(x)
        if not idx then return '' end
        local r, f = '', idx - 1
        for i = 6, 1, -1 do r = r .. (f % 2^i - f % 2^(i-1) > 0 and '1' or '0') end
        return r
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if #x ~= 8 then return '' end
        local c = 0
        for i = 1, 8 do c = c + (x:sub(i,i) == '1' and 2^(8-i) or 0) end
        return string.char(c)
    end))
end

local success, decoded = pcall(function()
    return _D(_V, _L)
end)

if success and decoded and #decoded > 0 then
    local code = (decoded:gsub('%%(%x%x)', function(hex)
        return string.char(tonumber(hex, 16))
    end))
    
    local f, err = loadstring(code)
    if f then
        f()
    else
        warn("[VEXIS] Error de compilacion: " + tostring(err))
    end
else
    warn("[VEXIS] Error al decodificar el payload.")
end
`;
                document.getElementById('outputCode').value = protectedScript;
                updateCounter();
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] Falló la protección del script.";
            }
        }

        function deobfuscateScript() {
            const input = document.getElementById('inputCode').value;
            if (!input) return;

            try {
                const match = input.match(/_V = "([^"]+)"/);
                if (!match || !match[1]) {
                    throw new Error("No se encontró un payload válido de Vexis.");
                }

                const levelMatch = input.match(/_L = "([^"]+)"/);
                const level = levelMatch ? levelMatch[1] : 'basic';

                let payload = match[1];
                let base64 = payload;

                if (level === 'medium') {
                    base64 = payload.split('').reverse().join('');
                } else if (level === 'advanced') {
                    base64 = payload.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 2)).join('');
                }

                let decodedURI = atob(base64);
                let originalCode = decodeURIComponent(decodedURI.split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));

                document.getElementById('outputCode').value = originalCode;
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] El código no tiene el formato de Vexis o está corrupto.";
            }
        }

        function downloadFile() {
            const code = document.getElementById('outputCode').value;
            if (!code) {
                alert('¡No hay código para descargar!');
                return;
            }
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vexis_protected.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearFields() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }

        function copyToClipboard() {
            const output = document.getElementById('outputCode');
            output.select();
            document.execCommand('copy');
            alert('¡Copiado al portapapeles!');
        }
    </script>
</body>
</html>
