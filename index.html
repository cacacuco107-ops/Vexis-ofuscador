<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Universal Code Protector</title>
    <style>
        :root {
            --bg-color: #0c0d12;
            --panel-bg: #161821;
            --accent: #00ff66;
            --text: #d0d0dc;
            --border: #2a2d3d;
            --input-bg: #090a0e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { color: var(--accent); font-size: 1.4rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p.sub { font-size: 0.8rem; color: #888; margin-bottom: 20px; }
        .section { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; color: var(--accent); font-size: 0.85rem; font-weight: bold; }
        select, textarea { width: 100%; background: var(--input-bg); color: var(--accent); border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 0.9rem; outline: none; }
        select { margin-bottom: 15px; cursor: pointer; color: var(--text); }
        select:focus, textarea:focus { border-color: var(--accent); }
        textarea { height: 160px; resize: vertical; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        button:hover { background: var(--accent); color: var(--bg-color); }
        button.secondary { color: #ff5555; border-color: #ff5555; }
        button.secondary:hover { background: #ff5555; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[§] Vexis // Universal Code Protector</h1>
        <p class="sub">Blindaje de código ultra compatible para Luau / Delta</p>

        <div class="section">
            <label>&gt; CÓDIGO DE ENTRADA:</label>
            <textarea id="inputCode" placeholder="Pega aquí tu script de Roblox..."></textarea>
            
            <div class="btn-group">
                <button onclick="protectCode()">BLINDAR CÓDIGO</button>
                <button class="secondary" onclick="clearFields()">LIMPIAR</button>
            </div>
        </div>

        <div class="section">
            <label>&gt; RESULTADO BLINDADO:</label>
            <textarea id="outputCode" readonly placeholder="El código protegido aparecerá aquí..."></textarea>
            
            <div class="btn-group">
                <button onclick="copyCode()">COPIAR AL PORTAPAPELES</button>
                <button onclick="downloadCode()">DESCARGAR ARCHIVO</button>
            </div>
        </div>
    </div>

    <script>
        function protectCode() {
            const input = document.getElementById('inputCode').value;
            if (!input) {
                alert("¡Pega algo de código primero!");
                return;
            }

            try {
                const encoder = new TextEncoder();
                const rawBytes = encoder.encode(input);
                
                // Clave de desplazamiento aritmética segura
                const key = Math.floor(Math.random() * 40) + 10;
                let obfuscatedBytes = [];
                for (let i = 0; i < rawBytes.length; i++) {
                    obfuscatedBytes.push((rawBytes[i] + key) & 0xFF);
                }

                let byteArrayStr = obfuscatedBytes.join(',');

                let finalOutput = `--[[
    VEXIS PROTECTED GUARD // ROBLOX / DELTA
]]--
local _K = ${key}
local _B = {${byteArrayStr}}
local function _R()
    local t = {}
    for i = 1, #_B do
        t[i] = string.char((_B[i] - _K) % 256)
    end
    local s = table.concat(t)
    local f, err = loadstring(s)
    if f then 
        local success, res = pcall(f)
        if not success then 
            warn("Vexis Runtime Error: " .. tostring(res)) 
        end
    else 
        warn("Vexis Compile Error: " .. tostring(err)) 
    end
end
_R()`;

                document.getElementById('outputCode').value = finalOutput;
            } catch (err) {
                alert("Error al procesar el código: " + err.message);
            }
        }

        function clearFields() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }

        function copyCode() {
            const output = document.getElementById('outputCode');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('¡Código copiado al portapapeles!');
        }

        function downloadCode() {
            const code = document.getElementById('outputCode').value;
            if (!code) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vexis_protected.lua';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
