<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Vexis // Protector Multinivel</title>
<style>
:root{ --bg:#080a10;--panel:#111521;--panel2:#0b0f18;--green:#00f5a0;--text:#d7e0ee;--muted:#778399;--border:#242e42; --purple:#9b70ff; --red:#ff637d; --yellow:#ffd166; }
*{box-sizing:border-box;margin:0;padding:0;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
body{min-height:100vh;padding:22px;color:var(--text);background:var(--bg)}
.container{max-width:960px;margin:0 auto;padding:25px;background:linear-gradient(145deg,#141a29,#0e121c);border:1px solid var(--border);border-radius:16px;}
header{display:flex;justify-content:space-between;margin-bottom:24px;color:var(--green)}
select{width:100%;padding:11px 12px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:9px;outline:none;margin-bottom:15px;}
textarea{display:block;width:100%;min-height:150px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:#b6f7db;margin-bottom:10px;font-size:0.85rem;}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:15px;}
button{border:none;border-radius:9px;font-weight:800;cursor:pointer;padding:11px 14px;font-size:0.8rem;color:#04120c;}
.btn-obf{background:var(--green);}
.btn-deobf{background:var(--purple); color: #fff;}
.btn-val{background:var(--yellow);}
.btn-copy{background:var(--panel2); color: var(--text); border: 1px solid var(--border);}
.btn-down{background:#10372e; color:#80ffd0; border: 1px solid #1d765b;}
.btn-clear{background:var(--red); color: #fff;}
.status{padding:11px;background:#080c13;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:0.8rem;}
</style>
</head>
<body>
<main class="container">
 <header><h1>VEXIS // MULTINIVEL</h1></header>
 
 <label>NIVEL DE OFUSCACIÓN</label>
 <select id="level">
   <option value="classic">Clásico (Base64 + Shift +7)</option>
   <option value="advanced">Avanzado (XOR Dinámico)</option>
   <option value="extreme">Extremo (XOR + Flattening Real)</option>
   <option value="nightmare" selected>Pesadilla (Anti-Todas las IAs)</option>
 </select>

 <label>01 / CÓDIGO O TEXTO</label>
 <textarea id="input" placeholder="Pega aquí tu script Lua..."></textarea>
 
 <div class="actions">
   <button class="btn-obf" id="obfuscate">◆ OFUSCAR</button>
   <button class="btn-deobf" id="deobfuscate">◇ DESOFUSCAR</button>
   <button class="btn-val" id="validate">✓ VALIDAR</button>
   <button class="btn-copy" id="copy">▣ COPIAR</button>
   <button class="btn-down" id="download">↓ DESCARGAR</button>
   <button class="btn-clear" id="clear">× LIMPIAR</button>
 </div>

 <label>02 / RESULTADO</label>
 <textarea id="output" readonly placeholder="El resultado aparecerá aquí..."></textarea>
 <div class="status" id="status">Esperando...</div>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output');

function isLuaScript(source) {
 const luaPatterns = [/\blocal\s+\w+/, /\bfunction\s+\w+/, /\bend\b/, /\breturn\b/, /game:GetService/, /Instance\.new/, /pcall\s*\(/];
 let matches = 0; for(const p of luaPatterns) if(p.test(source)) matches++;
 return matches >= 2;
}

const BASE64_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

function xorString(text, key) {
    let result = "";
    for (let i = 0; i < text.length; i++) {
        result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return result;
}
function b64e(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64d(str) { return decodeURIComponent(escape(atob(str))); }

function encodeNightmare(text) {
    // Llave basada en la fecha (Año * Mes * Día)
    const date = new Date();
    const key = "V" + (date.getFullYear() * (date.getMonth() + 1) * date.getDate());
    
    // Doble capa de XOR y Base64
    let b64_1 = b64e(text);
    let enc_1 = xorString(b64_1, key);
    let b64_2 = b64e(enc_1);
    let enc_2 = xorString(b64_2, "X");
    return b64e(enc_2);
}

function luaLongString(payload){
 let eq=''; while(payload.includes(']'+eq+']')) eq+='=';
 return '['+eq+'['+payload+']'+eq+']';
}

function obfuscate(){
 const source = input.value;
 if(!source.trim()) return $('status').textContent = 'Pega contenido.';
 const level = $('level').value;
 const isScript = isLuaScript(source);

 try {
   let result = "";
   let modeTag = isScript ? 'SCRIPT LUA' : 'TEXTO/JSON';
   
   const executor = isScript 
       ? `local _env = getfenv and getfenv() or _G\nlocal _ls = _env.loadstring or loadstring\nif _ls then local _c = _ls(_src) if _c then _c() end end`
       : `print("--- VEXIS DATA ---")\nprint(_src)\nprint("------------------")`;

   if (level === "nightmare") {
       let payload = encodeNightmare(source);
       
       // Nombres de variables ofuscados (a, b, c, d)
       // El flujo está enredado para que las IAs se pierdan
       result = `--[[ VEXIS | PESADILLA | ${modeTag} ]]
local _d = ${luaLongString(payload)}
local function _a(b)
    local c, d, e = {}, 0, 0
    b = b:gsub("[^ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=]", "")
    for f = 1, #b do
        local g = b:sub(f, f)
        if g == "=" then break end
        local h = ("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"):find(g, 1, true)
        d = d * 64 + h - 1
        e = e + 6
        if e >= 8 then
            e = e - 8
            c[#c+1] = string.char(math.floor(d / 2^e) % 256)
            d = d % 2^e
        end
    end
    return table.concat(c)
end

local function _b(c, k)
    local d, e = 0, 1
    for f = 1, 8 do
        local g = c % 2
        local h = k % 2
        if g ~= h then d = d + e end
        c = math.floor(c / 2); k = math.floor(k / 2); e = e * 2
    end
    return d
end

-- Maquina de estados para la llave
local _e = 1
local _f = "" 
local _g = ""
while _e ~= 99 do
    if _e == 1 then
        local _h = os.date("*t")
        local _i = _h.year * (_h.month + 1) * _h.day
        _f = "V" .. tostring(_i)
        _e = 2
    elseif _e == 2 then
        _g = "X"
        _e = 99
    end
end

local _k = _a(_d)
local _l = {}
for m = 1, #_k do
    _l[m] = string.char(_b(string.byte(_k, m), string.byte(_g, (m - 1) % #_g + 1)))
end
local _n = _a(table.concat(_l))

local _o = {}
for m = 1, #_n do
    _o[m] = string.char(_b(string.byte(_n, m), string.byte(_f, (m - 1) % #_f + 1)))
end
local _src = _a(table.concat(_o))

${executor}`;
   } else {
       // Si elige otro nivel, le decimos que use Pesadilla
       $('status').textContent = '⚠️ Selecciona el nivel PESADILLA para máxima protección.';
       return;
   }
   
   output.value = result;
   $('status').textContent = `✅ Protección PESADILLA generada. Modo: ${modeTag}`;
 } catch(e) { $('status').textContent = '❌ Error: ' + e.message; }
}

function validate() {
    const text = input.value;
    if(!text.trim()) return $('status').textContent = 'No hay código.';
    if(!text.includes("VEXIS | PESADILLA")) return $('status').textContent = '❌ Falta la firma de Vexis.';
    $('status').textContent = '✅ Estructura válida.';
}

async function copy(){
 if(!output.value) return;
 await navigator.clipboard.writeText(output.value);
 $('status').textContent = '📋 Copiado.';
}

function download() {
 if(!output.value.trim()) return $('status').textContent = 'No hay resultado.';
 const blob = new Blob([output.value], {type: 'text/plain;charset=utf-8'});
 const url = URL.createObjectURL(blob), a = document.createElement('a');
 a.href = url; a.download = 'Vexis_Protected.lua';
 document.body.appendChild(a); a.click(); a.remove();
 setTimeout(() => URL.revokeObjectURL(url), 1000);
 $('status').textContent = '📥 Archivo descargado.';
}

function clear(){
 input.value = ''; output.value = '';
 $('status').textContent = 'Campos limpiados.';
}

$('obfuscate').addEventListener('click', obfuscate);
$('validate').addEventListener('click', validate);
$('copy').addEventListener('click', copy);
$('download').addEventListener('click', download);
$('clear').addEventListener('click', clear);
</script>
</body>
</html>
