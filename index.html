<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>Vexis // Server Protector</title>
<style>
:root{ --bg:#080a10;--panel:#111521;--panel2:#0b0f18;--green:#00f5a0;--text:#d7e0ee;--muted:#778399;--border:#242e42; }
*{box-sizing:border-box;margin:0;padding:0;font-family:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace}
body{min-height:100vh;padding:22px;color:var(--text);background:var(--bg)}
.container{max-width:960px;margin:0 auto;padding:25px;background:linear-gradient(145deg,#141a29,#0e121c);border:1px solid var(--border);border-radius:16px;}
header{display:flex;justify-content:space-between;margin-bottom:24px;color:var(--green)}
textarea{display:block;width:100%;min-height:180px;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:#b6f7db;margin-bottom:10px;}
button{background:var(--green);color:#04120c;padding:11px 14px;border:none;border-radius:9px;font-weight:800;cursor:pointer;margin-right:5px;}
.status{padding:11px;background:#080c13;border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:0.8rem;}
</style>
</head>
<body>
<main class="container">
 <header><h1>VEXIS // SERVER PROTECTOR</h1></header>
 <label>01 / CÓDIGO DE ENTRADA</label>
 <textarea id="input" placeholder="Pega aquí tu script Lua..."></textarea>
 <button id="obfuscate">◆ OFUSCAR CON SERVIDOR</button>
 <button id="copy">▣ COPIAR</button>
 <div style="height:10px"></div>
 <label>02 / RESULTADO (Para tu GitHub)</label>
 <textarea id="output" readonly placeholder="El resultado aparecerá aquí..."></textarea>
 <div class="status" id="status">Esperando...</div>
</main>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output');

// ¡CAMBIA ESTA URL POR LA DE TU RENDER!
const SERVER_URL = "https://vexis-ofuscador.onrender.com/unlock";

function luaLongString(payload){
 let eq=''; while(payload.includes(']'+eq+']')) eq+='=';
 return '['+eq+'['+payload+']'+eq+']';
}

function encodePayload(text, key) {
    let b64 = btoa(unescape(encodeURIComponent(text)));
    let result = "";
    for (let i = 0; i < b64.length; i++) {
        result += String.fromCharCode(b64.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return btoa(unescape(encodeURIComponent(result)));
}

function obfuscate(){
 const source = input.value;
 if(!source.trim()) return $('status').textContent = 'Pega contenido.';

 try {
  // Llave y Auth para el servidor
  const key = "VexisLlaveMaestra2026"; 
  const auth = "VexisAuth2026";
  const payload = encodePayload(source, key);
  const isScript = /\blocal\s+\w+|\bfunction\s+\w+/.test(source);

  // El script de Lua que pide el código limpio al servidor
  const result = `--[[
  VEXIS PROTECTOR (Server Enforced)
]]

local VEXIS_PAYLOAD = ${luaLongString(payload)}
local AUTH_CODE = "${auth}"

local function getSource()
    local Http = game:GetService("HttpService")
    local req = request or http_request or (syn and syn.request) or (http and http.request)
    if not req then error("Executor HTTP unavailable") end
    
    local body = Http:JSONEncode({payload = VEXIS_PAYLOAD, auth = AUTH_CODE})
    local ok, res = pcall(req, {
        Url = "${SERVER_URL}", 
        Method = "POST", 
        Headers = {["Content-Type"] = "application/json"},
        Body = body
    })
    
    if not ok or res.StatusCode ~= 200 then return nil end
    local ok2, json = pcall(Http.JSONDecode, Http, res.Body)
    if ok2 and json and json.code then return json.code end
    return nil
end

local source = getSource()
if not source then error("VEXIS: Error de autenticacion o servidor caido.") end

${isScript ? 
`local env = getfenv and getfenv() or _G
local load_str = env.loadstring or loadstring
if load_str then
    local chunk = load_str(source)
    if chunk then chunk() end
end` : 
`print(source)`}
`;

  output.value = result;
  $('status').textContent = '✅ Protección blindada. La llave nunca viaja.';
 } catch(e) {
  $('status').textContent = '❌ Error: ' + e.message;
 }
}

async function copy(){
 if(!output.value) return;
 await navigator.clipboard.writeText(output.value);
 $('status').textContent = '📋 Copiado.';
}

$('obfuscate').addEventListener('click', obfuscate);
$('copy').addEventListener('click', copy);
</script>
</body>
</html>
