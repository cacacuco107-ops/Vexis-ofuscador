
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vexis // Ofuscador & Desofuscador Lua</title>

<style>
:root {
    --bg:#0a0a0c;
    --panel:#12131a;
    --green:#00ff66;
    --blue:#00bbff;
    --red:#ff5555;
    --text:#c0c0d0;
    --border:#222638;
    --input:#07080a;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Courier New',monospace;
}

body {
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}

.container {
    max-width:850px;
    margin:0 auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:25px;
    box-shadow:0 0 20px #00ff6610;
}

h1 {
    color:var(--green);
    font-size:1.4rem;
    margin-bottom:5px;
}

.subtitle {
    color:#666;
    font-size:.85rem;
    margin-bottom:20px;
}

label {
    display:block;
    color:var(--green);
    margin-bottom:8px;
    font-size:.9rem;
}

textarea {
    width:100%;
    height:150px;
    background:var(--input);
    color:var(--green);
    border:1px solid var(--border);
    border-radius:4px;
    padding:12px;
    font-size:.9rem;
    resize:vertical;
    margin-bottom:15px;
}

textarea:focus {
    outline:none;
    border-color:var(--green);
    box-shadow:0 0 8px #00ff6633;
}

.btn-row {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button {
    padding:10px 18px;
    border-radius:4px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
    border:none;
}

button:hover {
    transform:translateY(-2px);
    filter:brightness(1.15);
}

.btn-obf {
    background:var(--green);
    color:#000;
}

.btn-deobf {
    background:var(--blue);
    color:#000;
}

.btn-copy {
    background:#8855ff;
    color:white;
}

.btn-clear {
    background:var(--red);
    color:white;
}

.level-select {
    background:var(--input);
    color:var(--text);
    border:1px solid var(--border);
    padding:8px;
    border-radius:4px;
    margin-bottom:15px;
    width:100%;
    max-width:300px;
}

.status {
    margin-top:10px;
    font-size:.85rem;
    min-height:22px;
    word-break:break-word;
}

.success {color:var(--green);}
.error {color:var(--red);}

.auto-detect {
    color:var(--blue);
    font-size:.8rem;
    margin-left:10px;
}

.footer {
    text-align:center;
    color:#555;
    font-size:.75rem;
    margin-top:20px;
}

@media(max-width:550px) {
    body {padding:10px;}
    .container {padding:16px;}
    .btn-row button {flex:1 1 40%;}
}
</style>
</head>

<body>

<div class="container">

    <h1>[§] Vexis // Lua Protector</h1>

    <div class="subtitle">
        🔒 Ofuscador y desofuscador Lua
    </div>

    <label>Nivel de protección:</label>

    <select id="level" class="level-select">
        <option value="basic">Básico (Base64)</option>
        <option value="medium">Medio (Base64 + Invertido)</option>
        <option value="advanced" selected>
            Avanzado (Desplazamiento +3)
        </option>
    </select>

    <span id="autoDetect" class="auto-detect"></span>

    <label for="input">&gt; Código de entrada:</label>

    <textarea
        id="input"
        placeholder="Pega aquí tu script Lua o código protegido..."
        spellcheck="false"
    ></textarea>

    <div class="btn-row">

        <button class="btn-obf" onclick="obfuscate()">
            🔒 OFUSCAR
        </button>

        <button class="btn-deobf" onclick="deobfuscate()">
            🔓 DESOFUSCAR
        </button>

        <button class="btn-copy" onclick="copyOutput()">
            📋 COPIAR
        </button>

        <button class="btn-clear" onclick="clearAll()">
            ✖ LIMPIAR
        </button>

    </div>

    <label for="output">&gt; Resultado:</label>

    <textarea
        id="output"
        readonly
        placeholder="El resultado aparecerá aquí..."
        spellcheck="false"
    ></textarea>

    <div class="status" id="status"></div>

    <div class="footer">
        VEXIS LUA PROTECTOR // LOCAL PROCESSING
    </div>

</div>

<script>

// =====================================
// VEXIS - CORE
// =====================================

const $ = id => document.getElementById(id);

function showStatus(message, isError=false) {
    const status = $('status');

    status.textContent = message;
    status.className = 'status ' +
        (isError ? 'error' : 'success');
}

// =====================================
// UTF-8 / BASE64
// =====================================

function encodeBase64(text) {

    const bytes = new TextEncoder().encode(text);

    let binary = '';

    for (let i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
    }

    return btoa(binary);
}

function decodeBase64(text) {

    let clean = text.replace(/\s/g, '');

    if (!/^[A-Za-z0-9+/]*={0,2}$/.test(clean)) {
        throw new Error('El contenido Base64 contiene caracteres inválidos');
    }

    clean = clean.replace(/=+$/, '');

    if (clean.length % 4 === 1) {
        throw new Error('Longitud Base64 incorrecta');
    }

    while (clean.length % 4 !== 0) {
        clean += '=';
    }

    const binary = atob(clean);

    const bytes = new Uint8Array(binary.length);

    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    return new TextDecoder('utf-8', {
        fatal:true
    }).decode(bytes);
}

// =====================================
// PROTECCIÓN
// =====================================

function transformPayload(payload, level) {

    if (level === 'medium') {
        return payload.split('').reverse().join('');
    }

    if (level === 'advanced') {
        return payload.split('').map(char =>
            String.fromCharCode(char.charCodeAt(0) + 3)
        ).join('');
    }

    return payload;
}

// =====================================
// DESHACER PROTECCIÓN
// =====================================

function reversePayload(payload, level) {

    if (level === 'medium') {
        return payload.split('').reverse().join('');
    }

    if (level === 'advanced') {
        return payload.split('').map(char =>
            String.fromCharCode(char.charCodeAt(0) - 3)
        ).join('');
    }

    return payload;
}

// =====================================
// GENERAR CADENA LUA SEGURA
// =====================================

function luaLongString(payload) {

    let equals = '';

    while (payload.includes(']' + equals + ']')) {
        equals += '=';
    }

    return '[' + equals + '[' +
        payload +
        ']' + equals + ']';
}

// =====================================
// DETECTAR NIVEL
// =====================================

function autoDetectLevel(text) {

    const match = text.match(
        /(?:--\s*)?NIVEL\s*:\s*(advanced|medium|basic)/i
    );

    return match ? match[1].toLowerCase() : null;
}

// =====================================
// EXTRAER CONTENIDO LUA
// =====================================

function extractPayload(text) {

    // Formato nuevo: cadenas Lua largas.

    const longMatch = text.match(
        /return\s*\[(=*)\[([\s\S]*?)\]\1\]/
    );

    if (longMatch) {
        return longMatch[2];
    }

    // Compatibilidad con versiones anteriores.

    const match = text.match(
        /return\s+"((?:\\.|[^"\\])*)"/
    );

    if (match) {
        return decodeLuaString(match[1]);
    }

    // También permite pegar Base64 directamente.

    return text.trim();
}

// =====================================
// DECODIFICAR CADENAS LUA ANTIGUAS
// =====================================

function decodeLuaString(str) {

    return str.replace(
        /\\(\\|"|'|n|r|t|z|\d{1,3}|x[0-9a-fA-F]{2})/g,
        (match, code) => {

            if (code === '\\') return '\\';
            if (code === '"') return '"';
            if (code === "'") return "'";
            if (code === 'n') return '\n';
            if (code === 'r') return '\r';
            if (code === 't') return '\t';
            if (code === 'z') return '';

            if (/^\d+$/.test(code)) {
                return String.fromCharCode(Number(code));
            }

            if (/^x/i.test(code)) {
                return String.fromCharCode(
                    parseInt(code.substring(1), 16)
                );
            }

            return match;
        }
    );
}

// =====================================
// OFUSCAR
// =====================================

function obfuscate() {

    const input = $('input').value;
    const level = $('level').value;

    if (!input.trim()) {
        showStatus('Escribe un código primero', true);
        return;
    }

    try {

        // Codificar UTF-8 correctamente.

        let payload = encodeBase64(input);

        // Aplicar nivel seleccionado.

        payload = transformPayload(payload, level);

        // Crear cadena Lua segura.

        const luaString = luaLongString(payload);

        const result = `--[[
    VEXIS PROTECTED
    Nivel: ${level.toUpperCase()}
    Compatible con Vexis Decoder
]]--

return ${luaString}

-- NIVEL:${level}`;

        $('output').value = result;

        $('autoDetect').textContent = '';

        showStatus('✅ ¡Código protegido correctamente!');

    } catch (error) {

        showStatus('❌ Error: ' + error.message, true);

    }
}

// =====================================
// DESOFUSCAR
// =====================================

function deobfuscate() {

    const input = $('input').value;

    if (!input.trim()) {
        showStatus('Pega el código protegido', true);
        return;
    }

    try {

        // Detectar nivel automáticamente.

        const detected = autoDetectLevel(input);

        const level = detected || $('level').value;

        $('autoDetect').textContent = detected
            ? '✅ Nivel detectado: ' + level.toUpperCase()
            : '⚠️ Nivel seleccionado manualmente';

        // Extraer contenido.

        let payload = extractPayload(input);

        if (!payload || !payload.length) {
            throw new Error('No se encontró contenido protegido');
        }

        // Revertir transformación.

        payload = reversePayload(payload, level);

        // Decodificar Base64 y UTF-8.

        const decoded = decodeBase64(payload);

        $('output').value = decoded;

        showStatus('✅ ¡Código desofuscado correctamente!');

    } catch (error) {

        $('output').value = '';

        showStatus(
            '❌ No se pudo desofuscar: ' + error.message,
            true
        );

    }
}

// =====================================
// COPIAR
// =====================================

async function copyOutput() {

    const output = $('output');

    if (!output.value) {
        showStatus('No hay contenido para copiar', true);
        return;
    }

    try {

        await navigator.clipboard.writeText(output.value);

        showStatus('📋 ¡Copiado al portapapeles!');

    } catch (error) {

        output.focus();
        output.select();

        const copied = document.execCommand('copy');

        if (copied) {
            showStatus('📋 ¡Copiado al portapapeles!');
        } else {
            showStatus('No se pudo copiar automáticamente', true);
        }

    }
}

// =====================================
// LIMPIAR
// =====================================

function clearAll() {

    $('input').value = '';
    $('output').value = '';
    $('status').textContent = '';
    $('autoDetect').textContent = '';

}

// =====================================
// DETECCIÓN DE CAMBIOS
// =====================================

$('input').addEventListener('input', () => {
    $('autoDetect').textContent = '';
});

</script>

</body>
</html>
