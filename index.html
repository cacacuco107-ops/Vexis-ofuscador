<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Ofuscador & Desofuscador Lua</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --panel: #12131a;
            --green: #00ff66;
            --blue: #00bbff;
            --red: #ff5555;
            --text: #c0c0d0;
            --border: #222638;
            --input: #07080a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 25px;
        }
        h1 { color: var(--green); font-size: 1.4rem; margin-bottom: 5px; }
        .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 20px; }
        label { display: block; color: var(--green); margin-bottom: 8px; font-size: 0.9rem; }
        textarea {
            width: 100%;
            height: 150px;
            background: var(--input);
            color: var(--green);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus { outline: none; border-color: var(--green); }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        button {
            padding: 10px 18px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-obf { background: var(--green); color: #000; }
        .btn-obf:hover { background: #00cc44; }
        .btn-deobf { background: var(--blue); color: #000; }
        .btn-deobf:hover { background: #0088cc; }
        .btn-copy { background: #8855ff; color: white; }
        .btn-copy:hover { background: #6633dd; }
        .btn-clear { background: var(--red); color: white; }
        .btn-clear:hover { background: #cc3333; }
        .level-select {
            background: var(--input);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }
        .status {
            margin-top: 10px;
            font-size: 0.85rem;
            min-height: 22px;
        }
        .success { color: var(--green); }
        .error { color: var(--red); }
        .auto-detect { color: var(--blue); font-size: 0.8rem; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[§] Vexis // Lua Protector</h1>
        <div class="subtitle">Ofusca y desofusca tus scripts — ahora más robusto ✅</div>

        <label>Nivel de protección:</label>
        <select id="level" class="level-select">
            <option value="basic">Básico (Base64)</option>
            <option value="medium">Medio (Base64 + Invertido)</option>
            <option value="advanced" selected>Avanzado (Desplazamiento +3)</option>
        </select>
        <span id="autoDetect" class="auto-detect"></span>

        <label for="input">&gt; Código de entrada:</label>
        <textarea id="input" placeholder="Pega aquí tu script, o el bloque completo protegido..."></textarea>

        <div class="btn-row">
            <button class="btn-obf" onclick="obfuscate()">🔒 OFUSCAR</button>
            <button class="btn-deobf" onclick="deobfuscate()">🔓 DESOFUSCAR</button>
            <button class="btn-copy" onclick="copyOutput()">📋 COPIAR</button>
            <button class="btn-clear" onclick="clearAll()">✖ LIMPIAR</button>
        </div>

        <label for="output">&gt; Resultado:</label>
        <textarea id="output" readonly placeholder="El resultado aparecerá aquí..."></textarea>

        <div class="status" id="status"></div>
    </div>

    <script>
        function showStatus(text, isError = false) {
            const s = document.getElementById('status');
            s.textContent = text;
            s.className = 'status ' + (isError ? 'error' : 'success');
            setTimeout(() => s.textContent = '', 5000);
        }

        function cleanBase64(str) {
            return str.replace(/[^A-Za-z0-9+/=]/g, '');
        }

        function autoDetectLevel(text) {
            if (text.includes('NIVEL:advanced') || text.includes('NIVEL: ADVANCED')) return 'advanced';
            if (text.includes('NIVEL:medium') || text.includes('NIVEL: MEDIUM')) return 'medium';
            if (text.includes('NIVEL:basic') || text.includes('NIVEL: BASIC')) return 'basic';
            return null;
        }

        function extractPayload(text) {
            let match = text.match(/"([\s\S]*?)"/);
            if (match && match[1]) return cleanBase64(match[1]);
            return cleanBase64(text);
        }

        function obfuscate() {
            const input = document.getElementById('input').value;
            const level = document.getElementById('level').value;
            if (!input.trim()) { showStatus('Escribe algo primero', true); return; }

            try {
                let payload = btoa(unescape(encodeURIComponent(input)));

                if (level === 'medium') {
                    payload = payload.split('').reverse().join('');
                } else if (level === 'advanced') {
                    payload = payload.split('').map(c =>
                        String.fromCharCode(c.charCodeAt(0) + 3)
                    ).join('');
                }

                const result = `--[[
    VEXIS PROTECTED
    Nivel: ${level.toUpperCase()}
    ⚠️ Usa esta página para desofuscarlo
]]--
return "${payload}"
-- NIVEL:${level}`;

                document.getElementById('output').value = result;
                showStatus('✅ ¡Ofuscado correctamente!');
            } catch (e) {
                showStatus('❌ Error: ' + e.message, true);
            }
        }

        function deobfuscate() {
            const input = document.getElementById('input').value;
            if (!input.trim()) { showStatus('Pega el código protegido', true); return; }

            try {
                const detected = autoDetectLevel(input);
                const level = detected || document.getElementById('level').value;
                document.getElementById('autoDetect').textContent = detected ? `✅ Nivel detectado automáticamente: ${level.toUpperCase()}` : '';

                let payload = extractPayload(input);
                if (!payload) throw new Error('No se encontró código válido');

                if (level === 'medium') {
                    payload = payload.split('').reverse().join('');
                } else if (level === 'advanced') {
                    payload = payload.split('').map(c =>
                        String.fromCharCode(c.charCodeAt(0) - 3)
                    ).join('');
                }

                const decoded = decodeURIComponent(escape(atob(payload)));
                document.getElementById('output').value = decoded;
                showStatus('✅ ¡Desofuscado correctamente!');
            } catch (e) {
                showStatus('❌ Error: ' + e.message + ' — Asegúrate de pegar el bloque completo', true);
            }
        }

        function copyOutput() {
            const out = document.getElementById('output');
            if (!out.value) return;
            out.select();
            document.execCommand('copy');
            showStatus('📋 ¡Copiado al portapapeles!');
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('status').textContent = '';
            document.getElementById('autoDetect').textContent = '';
        }
    </script>
</body>
</html>
