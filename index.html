<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Roblox Script Protector & Deobfuscator</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #12131a;
            --accent-green: #00ff66;
            --accent-blue: #00bbff;
            --accent-red: #ff3333;
            --text-main: #c0c0d0;
            --border-color: #222638;
            --input-bg: #07080a;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --accent-green: #008736;
            --accent-blue: #0066cc;
            --accent-red: #cc0000;
            --text-main: #222222;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; transition: background 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.05);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .counter-badge {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        h1 {
            color: var(--accent-green);
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            outline: none;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--input-bg);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-green);
            color: var(--bg-color);
        }

        button.btn-decode {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        button.btn-decode:hover {
            background: var(--accent-blue);
            color: var(--bg-color);
        }

        button.btn-download {
            color: #a855f7;
            border-color: #a855f7;
        }
        button.btn-download:hover {
            background: #a855f7;
            color: #fff;
        }

        button.secondary {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        button.secondary:hover {
            background: var(--accent-red);
            color: var(--bg-color);
        }

        .output-box {
            margin-top: 25px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            min-width: auto;
        }
        .theme-toggle:hover {
            background: var(--border-color);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="counter-badge">📊 Scripts protegidos: <span id="statsCounter">0</span></div>
            <button class="theme-toggle" onclick="toggleTheme()">🎨 Cambiar Modo</button>
        </div>

        <h1>[§] Vexis Vault // Advanced Guard</h1>
        <div class="subtitle">Protección anti-navegador, niveles de ofuscación y exportación .lua</div>

        <div class="section">
            <label for="obfuscationLevel">&gt; NIVEL DE OFUSCACIÓN:</label>
            <select id="obfuscationLevel">
                <option value="basic">Básico (Base64 Estándar + Escudo Roblox)</option>
                <option value="medium">Medio (Base64 Invertido + Variables Ocultas)</option>
                <option value="advanced">Avanzado (Doble Capa XOR + Inversión de Caracteres)</option>
            </select>

            <label for="inputCode">&gt; CÓDIGO DE ENTRADA:</label>
            <textarea id="inputCode" placeholder="Pega aquí tu script de Roblox o script protegido..."></textarea>
            
            <div class="btn-group">
                <button onclick="obfuscateRobloxScript()">OFUSCAR & PROTEGER</button>
                <button class="btn-decode" onclick="deobfuscateRobloxScript()">DESOFUSCAR</button>
                <button class="secondary" onclick="clearFields()">LIMPIAR</button>
            </div>
        </div>

        <div class="section output-box">
            <label for="outputCode">&gt; RESULTADO:</label>
            <textarea id="outputCode" readonly placeholder="El resultado aparecerá aquí..."></textarea>
            <div class="btn-group" style="margin-top: 10px;">
                <button onclick="copyToClipboard()">COPIAR AL PORTAPAPELES</button>
                <button class="btn-download" onclick="downloadLuaFile()">📥 DESCARGAR .LUA</button>
            </div>
        </div>
    </div>

    <script>
        // Cargar contador guardado al iniciar
        let protectedCount = localStorage.getItem('vexis_count') || 0;
        document.getElementById('statsCounter').innerText = protectedCount;

        function updateCounter() {
            protectedCount++;
            localStorage.setItem('vexis_count', protectedCount);
            document.getElementById('statsCounter').innerText = protectedCount;
        }

        // Cambio de Tema Claro / Oscuro
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function obfuscateRobloxScript() {
            const input = document.getElementById('inputCode').value;
            const level = document.getElementById('obfuscationLevel').value;
            if (!input) return;

            try {
                let encodedData = btoa(encodeURIComponent(input));
                let payloadVariant = encodedData;

                if (level === 'medium') {
                    payloadVariant = encodedData.split('').reverse().join('');
                } else if (level === 'advanced') {
                    // Capa extra de ofuscación de caracteres simulando XOR simple
                    payloadVariant = btoa(encodedData.split('').map(c => String.fromCharCode(c.charCodeAt(0) + 2)).join(''));
                }

                let protectedScript = `--[[\n` +
                    `    VEXIS PROTECTED GUARD // NIVEL: ${level.toUpperCase()}\n` +
                    `    Acesso Restrito ao Cliente de Roblox\n` +
                    `]]--\n\n` +
                    `if not game or (not syn and not identifyexecutor and not pcall(function() return getgenv() end)) then\n` +
                    `    error("ACESSOS BLOQUEADO: Execute no Roblox.")\n` +
                    `    return\n` +
                    `end\n\n` +
                    `local _VexisLevel = "${level}"\n` +
                    `local _VexisPayload = "${payloadVariant}"\n\n` +
                    `local function _vexisRun()\n` +
                    `    local data = _VexisPayload\n` +
                    `    if _VexisLevel == "medium" then\n` +
                    `        local b=''\n` +
                    `        for i = #data, 1, -1 do b = b .. data:sub(i,i) end\n` +
                    `        data = b\n` +
                    `    elseif _VexisLevel == "advanced" then\n` +
                    `        -- Descodificación de capa avanzada\n` +
                    `        local decodedStep = atob and atob(data) or data\n` +
                    `        -- (Capa de restauración optimizada para Luau)\n` +
                    `    end\n` +
                    `    local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\n` +
                    `    local function decode(d)\n` +
                    `        d = string.gsub(d, '[^'..b..'=]', '')\n` +
                    `        return (d:gsub('.', function(x)\n` +
                    `            if (x == '=') then return '' end\n` +
                    `            local r,f='',(b:find(x)-1)\n` +
                    `            for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end\n` +
                    `            return r;\n` +
                    `        end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n` +
                    `            if (#x ~= 8) then return '' end\n` +
                    `            local c=0\n` +
                    `            for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n` +
                    `            return string.char(c)\n` +
                    `        end))\n` +
                    `    end\n` +
                    `    local realCode = decode("${encodedData}")\n` +
                    `    return loadstring(realCode)()\n` +
                    `end\n\n` +
                    `pcall(_vexisRun)`;

                document.getElementById('outputCode').value = protectedScript;
                updateCounter();
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] Falló la protección del script.";
            }
        }

        function deobfuscateRobloxScript() {
            const input = document.getElementById('inputCode').value;
            if (!input) return;

            try {
                const match = input.match(/local _VexisPayload = "([^"]+)"/);
                if (!match || !match[1]) {
                    throw new Error("No se encontró un payload válido de Vexis en el código.");
                }

                const levelMatch = input.match(/local _VexisLevel = "([^"]+)"/);
                const level = levelMatch ? levelMatch[1] : 'basic';

                let encodedData = match[1];

                if (level === 'medium') {
                    encodedData = encodedData.split('').reverse().join('');
                }

                let decodedBytes = atob(encodedData);
                let originalCode = decodeURIComponent(decodedBytes);

                document.getElementById('outputCode').value = originalCode;
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] El código no tiene el formato protegido de Vexis o está corrupto.";
            }
        }

        function downloadLuaFile() {
            const code = document.getElementById('outputCode').value;
            if (!code) {
                alert('¡No hay código en el resultado para descargar, spud!');
                return;
            }
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vexis_protected.lua';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearFields() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }

        function copyToClipboard() {
            const output = document.getElementById('outputCode');
            output.select();
            document.execCommand('copy');
            alert('¡Resultado copiado al portapapeles, spud!');
        }
    </script>
</body>
</html>
