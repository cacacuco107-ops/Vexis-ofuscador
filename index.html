<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Universal Script Protector</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #12131a;
            --accent-green: #00ff66;
            --text-main: #c0c0d0;
            --border-color: #222638;
            --input-bg: #07080a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        h1 { color: var(--accent-green); font-size: 1.3rem; margin-bottom: 15px; text-transform: uppercase; }
        label { display: block; margin-bottom: 6px; color: var(--accent-green); font-size: 0.85rem; }
        select, textarea { width: 100%; background: var(--input-bg); color: var(--accent-green); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.9rem; margin-bottom: 12px; outline: none; }
        textarea { height: 130px; resize: vertical; }
        .btn-group { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        button { flex: 1; min-width: 120px; background: transparent; color: var(--accent-green); border: 1px solid var(--accent-green); padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: var(--accent-green); color: var(--bg-color); }
    </style>
</head>
<body>
    <div class="container">
        <h1>[§] Vexis Vault</h1>
        
        <label>NIVEL DE OFUSCACIÓN:</label>
        <select id="obfuscationLevel">
            <option value="hex">Hexadecimal Seguro (Soporte Emojis)</option>
        </select>

        <label>CÓDIGO DE ENTRADA:</label>
        <textarea id="inputCode" placeholder="Pega aquí tu script..."></textarea>
        
        <div class="btn-group">
            <button onclick="protectScript()">OFUSCAR & PROTEGER</button>
            <button onclick="clearFields()">LIMPIAR</button>
        </div>

        <label>RESULTADO:</label>
        <textarea id="outputCode" readonly placeholder="El resultado completo aparecerá aquí..."></textarea>
        
        <div class="btn-group">
            <button onclick="copyToClipboard()">COPIAR</button>
            <button onclick="downloadFile()">DESCARGAR .TXT</button>
        </div>
    </div>

    <script>
        function stringToHex(str) {
            const bytes = new TextEncoder().encode(str);
            let hex = '';
            for (let i = 0; i < bytes.length; i++) {
                let h = bytes[i].toString(16);
                if (h.length === 1) h = '0' + h;
                hex += h;
            }
            return hex;
        }

        function protectScript() {
            const input = document.getElementById('inputCode').value;
            if (!input) return;

            try {
                let payload = stringToHex(input);

                let protectedScript = `--[[\n    VEXIS PROTECTED GUARD - Delta Compatible\n]]--\n\n` +
                    `local _VData = "${payload}"\n\n` +
                    `local function _vexisRun()\n` +
                    `    local hex = _VData\n` +
                    `    local bytes = {}\n` +
                    `    for i = 1, #hex, 2 do\n` +
                    `        local code = tonumber(hex:sub(i, i+1), 16)\n` +
                    `        if code then\n` +
                    `            table.insert(bytes, string.char(code))\n` +
                    `        end\n` +
                    `    end\n` +
                    `    local realCode = table.concat(bytes)\n` +
                    `    local fn, err = loadstring(realCode)\n` +
                    `    if fn then\n` +
                    `        fn()\n` +
                    `    else\n` +
                    `        warn("[VEXIS] Error de compilacion: " .. tostring(err))\n` +
                    `    end\n` +
                    `end\n\n` +
                    `_vexisRun()`;

                document.getElementById('outputCode').value = protectedScript;
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] Falló la protección.";
            }
        }

        function downloadFile() {
            const code = document.getElementById('outputCode').value;
            if (!code) return;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vexis_protected.txt';
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearFields() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }

        function copyToClipboard() {
            const output = document.getElementById('outputCode');
            output.select();
            document.execCommand('copy');
            alert('¡Copiado!');
        }
    </script>
</body>
</html>
