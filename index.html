<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vexis // Universal Script Protector & Deobfuscator</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #12131a;
            --accent-green: #00ff66;
            --accent-blue: #00bbff;
            --accent-red: #ff3333;
            --text-main: #c0c0d0;
            --border-color: #222638;
            --input-bg: #07080a;
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --accent-green: #008736;
            --accent-blue: #0066cc;
            --accent-red: #cc0000;
            --text-main: #222222;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; transition: background 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(0, 255, 102, 0.05);
            position: relative;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .counter-badge {
            font-size: 0.85rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        h1 {
            color: var(--accent-green);
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent-green);
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            background: var(--input-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 10px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            outline: none;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: var(--input-bg);
            color: var(--accent-green);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            font-size: 0.95rem;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-green);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 130px;
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background: var(--accent-green);
            color: var(--bg-color);
        }

        button.btn-decode {
            color: var(--accent-blue);
            border-color: var(--accent-blue);
        }
        button.btn-decode:hover {
            background: var(--accent-blue);
            color: var(--bg-color);
        }

        button.btn-download {
            color: #a855f7;
            border-color: #a855f7;
        }
        button.btn-download:hover {
            background: #a855f7;
            color: #fff;
        }

        button.secondary {
            color: var(--accent-red);
            border-color: var(--accent-red);
        }
        button.secondary:hover {
            background: var(--accent-red);
            color: var(--bg-color);
        }

        .output-box {
            margin-top: 25px;
        }

        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 4px;
            min-width: auto;
        }
        .theme-toggle:hover {
            background: var(--border-color);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <div class="counter-badge">📊 Scripts protegidos: <span id="statsCounter">0</span></div>
            <button class="theme-toggle" onclick="toggleTheme()">🎨 Cambiar Modo</button>
        </div>

        <h1>[§] Vexis Vault // Universal Guard</h1>
        <div class="subtitle">Protección avanzada, soporte total de Emojis y compatibilidad con Delta</div>

        <div class="section">
            <label for="obfuscationLevel">&gt; NIVEL DE OFUSCACIÓN:</label>
            <select id="obfuscationLevel">
                <option value="basic">Básico (Hexadecimal Estándar)</option>
                <option value="medium">Medio (Hex Invertido + Variables Ocultas)</option>
                <option value="advanced">Avanzado (Doble Capa XOR + Hex Blindado)</option>
            </select>

            <label for="inputCode">&gt; CÓDIGO DE ENTRADA:</label>
            <textarea id="inputCode" placeholder="Pega aquí tu script con emojis (ej. NEXORA_PLUS)..."></textarea>
            
            <div class="btn-group">
                <button onclick="protectScript()">OFUSCAR & PROTEGER</button>
                <button class="btn-decode" onclick="deobfuscateScript()">DESOFUSCAR</button>
                <button class="secondary" onclick="clearFields()">LIMPIAR</button>
            </div>
        </div>

        <div class="section output-box">
            <label for="outputCode">&gt; RESULTADO:</label>
            <textarea id="outputCode" readonly placeholder="El resultado aparecerá aquí..."></textarea>
            <div class="btn-group" style="margin-top: 10px;">
                <button onclick="copyToClipboard()">COPIAR AL PORTAPAPELES</button>
                <button class="btn-download" onclick="downloadFile()">📥 DESCARGAR .TXT</button>
            </div>
        </div>
    </div>

    <script>
        let protectedCount = localStorage.getItem('vexis_count') || 0;
        document.getElementById('statsCounter').innerText = protectedCount;

        function updateCounter() {
            protectedCount++;
            localStorage.setItem('vexis_count', protectedCount);
            document.getElementById('statsCounter').innerText = protectedCount;
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // Convierte texto UTF-8 (con emojis) a Hexadecimal seguro
        function stringToHex(str) {
            const utf8Bytes = new TextEncoder().encode(str);
            let hex = '';
            for (let i = 0; i < utf8Bytes.length; i++) {
                let h = utf8Bytes[i].toString(16);
                if (h.length === 1) h = '0' + h;
                hex += h;
            }
            return hex;
        }

        function protectScript() {
            const input = document.getElementById('inputCode').value;
            const level = document.getElementById('obfuscationLevel').value;
            if (!input) return;

            try {
                let hexData = stringToHex(input);
                let payload = hexData;

                if (level === 'medium') {
                    payload = hexData.split('').reverse().join('');
                } else if (level === 'advanced') {
                    // Capa XOR simulada en Hex
                    payload = hexData.match(/.{1,2}/g).map(byte => {
                        let val = parseInt(byte, 16) ^ 0x5A;
                        let h = val.toString(16);
                        return h.length === 1 ? '0' + h : h;
                    }).join('');
                }

                let protectedScript = `--[[
    VEXIS PROTECTED GUARD // NIVEL: ${level.toUpperCase()}
    🛡️ Motor Hex Blindado - 100% Compatible con Emojis y Delta
]]--

local _VLevel = "${level}"
local _VData = "${payload}"

local function _vexisRun()
    local hex = _VData
    if _VLevel == "medium" then
        hex = hex:reverse()
    elseif _VLevel == "advanced" then
        local res = {}
        for i = 1, #hex, 2 do
            local byteHex = hex:sub(i, i+1)
            local val = tonumber(byteHex, 16)
            if val then
                table.insert(res, string.format("%02x", val ~ 0x5A))
            end
        end
        hex = table.concat(res)
    end
    
    local bytes = {}
    for i = 1, #hex, 2 do
        local code = tonumber(hex:sub(i, i+1), 16)
        if code then
            table.insert(bytes, string.char(code))
        end
    end
    
    local realCode = table.concat(bytes)
    local fn, err = loadstring(realCode)
    if fn then
        fn()
    else
        warn("[VEXIS] Error de compilacion: " .. tostring(err))
    end
end

_vexisRun()
`;
                document.getElementById('outputCode').value = protectedScript;
                updateCounter();
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] Falló la protección del script.";
            }
        }

        function deobfuscateScript() {
            const input = document.getElementById('inputCode').value;
            if (!input) return;

            try {
                const match = input.match(/local _VData = "([^"]+)"/);
                if (!match || !match[1]) {
                    throw new Error("No se encontró un payload válido de Vexis.");
                }

                const levelMatch = input.match(/local _VLevel = "([^"]+)"/);
                const level = levelMatch ? levelMatch[1] : 'basic';

                let hex = match[1];

                if (level === 'medium') {
                    hex = hex.split('').reverse().join('');
                } else if (level === 'advanced') {
                    let res = [];
                    for (let i = 0; i < hex.length; i += 2) {
                        let byteHex = hex.substr(i, 2);
                        let val = parseInt(byteHex, 16) ^ 0x5A;
                        let h = val.toString(16);
                        res.push(h.length === 1 ? '0' + h : h);
                    }
                    hex = res.join('');
                }

                let byteArray = new Uint8Array(hex.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
                let originalCode = new TextDecoder().decode(byteArray);

                document.getElementById('outputCode').value = originalCode;
            } catch (e) {
                document.getElementById('outputCode').value = "[ERROR] El código no tiene el formato de Vexis o está corrupto.";
            }
        }

        function downloadFile() {
            const code = document.getElementById('outputCode').value;
            if (!code) {
                alert('¡No hay código para descargar!');
                return;
            }
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'vexis_protected.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function clearFields() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
        }

        function copyToClipboard() {
            const output = document.getElementById('outputCode');
            output.select();
            document.execCommand('copy');
            alert('¡Copiado al portapapeles!');
        }
    </script>
</body>
</html>
